<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nick Pham | CRUD</title>
        <link rel="stylesheet" href="styles.css">
         <style>
                /* disable animation for form and titles */
                form, ol {
                    animation: none !important;
                    opacity: 1 !important;
                }
        </style>
    </head>
    <body>
        <header>
            <h1>Project Card Creation (CRUD)
                <bttn-group><button id="theme-toggle">Invert Dark/Light Mode</button><button id="load-local">Load Local</button></bttn-group>
            </h1>
        </header>

        <main>
            <h2>Try creating a project yourself!</h2>
            <form> 
                <fieldset>
                    <legend><b>Project Manager</b></legend>
                    <label for="title">Project Title:</label><br>
                    <input type="text" id="title" name="title" required><br>

                    <label for="description">Project Description:</label><br>
                    <textarea id="description" name="description" rows="4" cols="50" placeholder="description goes here..." required></textarea><br>

                    <label for="thumbnail">Project Thumbnail:</label><br>
                    <input type="file" id="thumbnail" name="thumbnail" required><br>

                    <label for="thumbnailMed">Project Thumbnail (Medium) (optional):</label><br>
                    <input type="file" id="thumbnailMed" name="thumbnailMed"><br>

                    <label for="thumbnailBig">Project Thumbnail (Large) (optional):</label><br>
                    <input type="file" id="thumbnailBig" name="thumbnailBig"><br>

                    <label for="link">Project Link (URL or local path):</label><br>
                    <aside>NOTE: please enter a valid URL (starting with http:// or https://) if using URL!</aside>
                    <input type="text" id="link" name="link" required><br>

                    <button type="submit" id="project-manager-bttn">Create Project</button>
                </fieldset>
            </form>

            <h2>Current Projects in Storage:</h2>
            <project-list>
                <ol></ol>
            </project-list>

            <h2>Project Cards:</h2>
            <project-output></project-output>
        </main>

        <footer>
            <nav>
                <input type="checkbox" id="nav-toggle" class="nav"/>
                <label for="nav-toggle" class="nav">Navigation</label>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="involvements.html">Involvements</a></li>
                </ul>
            </nav>
            <noscript>
                Light and Dark mode are configured to use system preferences by default. To manually switch between modes, please enable JavaScript in your browser.
                <br>Additionally, some interactive features may not function properly without JavaScript enabled.
            </noscript>
        </footer>
        <script src="theme-toggle.js"></script>
        <script type="module" src="project-card.js"></script>
        <script type="module" src="project-crud.js"></script>
    </body>
</html>
