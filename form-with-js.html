<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nick Pham | Contact Form (No JS)</title>
        <link rel="stylesheet" href="styles.css">
        <style> 
            @keyframes fadeOut {
                from {opacity: 1;}
                to {opacity: 0;}
            }

            :user-invalid {
                border: 0.4rem solid red;
            }

            .near-char-limit {
                border: 0.4rem solid orange;
            }
            .at-character-limit {
                border: 0.4rem solid red;
            }
            .error-hide {
                display: none;
            }
            .error-show{
                font-weight: bold;
                display: block;
                color: red;
                animation: fadeOut 4s forwards;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Form</h1>
        </header>

        <main>
            <form action="https://httpbin.org/post" method="POST">
                <fieldset>
                    <legend>Contact Form (No JS)</legend>
                    <label for="name">Name (required):</label><br>
                    <input type="text" id="name" name="name" pattern="[a-zA-Z\- ]+" title="Name should only contain letters" required><br>
                    
                    <label for="email">Email (required):</label><br>
                    <input type="email" id="email" name="email" pattern="[a-zA-Z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Enter a valid email address (e.g., user@example.com)" required><br>
                    
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Enter a 10-digit phone number"><br>

                    <input type="hidden" name="possible_bot" value="true">
                    
                    <label for="comment">Comments:</label><br>
                    <textarea id="comment" name="comment" maxlength="50"></textarea><br>
                    
                    <button type="submit">Submit</button><br><br>

                    <label for="info">Info messages:</label><br>
                    <output name="info" id="info" for="name email phone comment"></output><br>

                    <label for="error-name">Error messages:</label><br>
                    <output name="error-name" id="error-name" for="name"></output><br>
                    <output name="error-email" id="error-email" for="email"></output><br>
                    <output name="error-phone" id="error-phone" for="phone"></output><br>
                    <output name="error-comment" id="error-comment" for="comment"></output><br>
                </fieldset>
            </form>
        </main>

        <footer>
            <nav>
                <a href="./index.html">Back to Main Page</a>
            </nav>
        </footer>
        <script src="form-validation-script.js"></script>
    </body>
</html>
